start_boost:
  name: Start Boost
  description: Start boost mode on a Cala device.
  fields:
    device_id:
      name: Device ID
      description: Cala device ID (e.g. 2507xxa006).
      required: true
      example: "2507xxa006"
      selector:
        text:

    duration:
      name: Duration (hours)
      description: Boost duration in hours. Defaults to 24.
      required: false
      example: 24
      default: 24
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: h

stop_boost:
  name: Stop Boost
  description: Stop boost mode on a Cala device.
  fields:
    device_id:
      name: Device ID
      description: Cala device ID (e.g. 2507xxa006).
      required: true
      example: "2507xxa006"
      selector:
        text:

set_tou_schedule:
  name: Set TOU schedule
  description: >
    Push a period-based Time-of-Use rate schedule to a Cala device. Rates are
    absolute $/kWh. Times not covered by a period fall back to defaultRate.
    Bounds: at most 4 seasons, 4 daySchedules per season, 8 periods per
    daySchedule. Period times are minutes since local midnight (startMin
    inclusive, endMin exclusive, max 1440); periods must not overlap or cross
    midnight. Season dates are inclusive MM-DD and may wrap the year end.
    For dynamic rates pulled from another HA entity, prefer the
    `tou_rates_entity` option in the integration's Configure dialog instead of
    calling this service directly.
  fields:
    device_id:
      name: Device ID
      description: Cala device ID (e.g. 2507xxa006).
      required: true
      example: "2507xxa006"
      selector:
        text:
    schedule:
      name: Schedule
      description: >
        TOU schedule object. `version` must be 1, `defaultRate` ($/kWh) must
        be positive, day names are lowercase sun/mon/tue/wed/thu/fri/sat.
      required: true
      example: >
        {"version": 1, "defaultRate": 0.12, "seasons": [{"startDate": "06-01",
        "endDate": "09-30", "daySchedules": [{"days": ["mon", "tue", "wed",
        "thu", "fri"], "periods": [{"startMin": 600, "endMin": 840,
        "rate": 0.32}]}]}]}
      selector:
        object:
